name: Headless campaign

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  frozen-campaign:
    name: Frozen campaign (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    env:
      ORBIT_SEU_ROOT: ""
    defaults:
      run:
        working-directory: code/layout_ecc_sim
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run public suite (live-only tests report as skipped)
        run: python -m unittest discover -s tests -v
      - name: Generate the smoke campaign
        run: python -m layout_ecc.campaign --out "$RUNNER_TEMP/campaign"

  live-orbit:
    name: Live orbit (manual, protected environment)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: orbit-seu-integration
    defaults:
      run:
        working-directory: code/layout_ecc_sim
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read orbit_seu lock
        id: orbit
        shell: bash
        run: |
          revision="$(tr -d '\r\n' < orbit-seu.rev)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Check out pinned orbit_seu dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: juwadeLone/tcas
          ref: ${{ steps.orbit.outputs.revision }}
          token: ${{ secrets.ORBIT_SEU_READ_TOKEN }}
          path: .deps/tcas
          persist-credentials: false
          sparse-checkout: code/orbit_seu
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: "3.10"
      - name: Recompute and check frozen MEO rates
        env:
          ORBIT_SEU_ROOT: ${{ github.workspace }}/.deps/tcas/code/orbit_seu
        run: |
          python -m layout_ecc.campaign --live-orbit --out "$RUNNER_TEMP/campaign-live"
          python -m unittest discover -s tests -p test_orbit_frozen_consistency.py -v
