name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: layout_ecc test suite
        working-directory: code/layout_ecc_sim
        run: python -m unittest discover -s tests -v

      - name: orbit_seu test suite
        working-directory: code/orbit_seu
        run: python -m unittest discover -s tests -v
