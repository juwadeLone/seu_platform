<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识星系 · FPGA Horizons 第二大脑</title>
<style>
:root{--bg:#05070f;--ink:#e8ecf6;--dim:#8b94b3;--accent:#5ea0ff;--line:rgba(255,255,255,.1);--mono:Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Serif SC","Songti SC",Georgia,serif;overflow:hidden;height:100vh}
#cv{position:absolute;inset:0;cursor:grab}
#cv:active{cursor:grabbing}
#hud{position:absolute;top:18px;left:22px;pointer-events:none}
#hud h1{font-size:22px;letter-spacing:.04em}
#hud .sub{font-size:12.5px;color:var(--dim);font-family:var(--mono);margin-top:4px}
#stats{position:absolute;left:22px;bottom:18px;font-family:var(--mono);font-size:12px;color:var(--dim);pointer-events:none;line-height:1.9}
#stats b{color:var(--ink);font-size:15px}
#legend{position:absolute;right:22px;top:18px;font-size:12px;color:var(--dim);background:rgba(10,14,28,.72);border:1px solid var(--line);border-radius:10px;padding:12px 14px;backdrop-filter:blur(8px)}
#legend div{display:flex;align-items:center;gap:8px;margin:3px 0}
#legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
#search{position:absolute;left:22px;top:86px}
#search input{background:rgba(10,14,28,.8);border:1px solid var(--line);border-radius:99px;color:var(--ink);padding:7px 16px;font-size:13px;width:220px;outline:none}
#search input:focus{border-color:var(--accent)}
#panel{position:absolute;right:22px;top:50%;transform:translateY(-50%);width:300px;background:rgba(10,14,28,.9);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:none;backdrop-filter:blur(10px)}
#panel h2{font-size:16px;margin-bottom:6px;word-break:break-all}
#panel .meta{font-family:var(--mono);font-size:11.5px;color:var(--dim);line-height:1.8;word-break:break-all}
#panel .nb{margin-top:10px;font-size:12.5px;line-height:1.9;max-height:180px;overflow:auto}
#panel .nb a{color:var(--accent);text-decoration:none;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panel button{margin-top:12px;background:var(--accent);border:none;color:#06101f;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:700}
#panel .close{position:absolute;top:8px;right:12px;background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer;padding:2px}
#tip{position:absolute;pointer-events:none;background:rgba(10,14,28,.92);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:12.5px;display:none;font-family:var(--mono)}
#help{position:absolute;bottom:18px;right:22px;font-size:11.5px;color:var(--dim);font-family:var(--mono);text-align:right;line-height:1.8;pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <h1>知识星系 · FPGA Horizons 第二大脑</h1>
  <div class="sub">每个点 = 一篇笔记 · 每条线 = 一个 [[双链]] · 点越大 = 枢纽越强</div>
</div>
<div id="search"><input id="q" type="text" placeholder="搜索笔记名…"></div>
<div id="legend"></div>
<div id="stats"></div>
<div id="tip"></div>
<div id="panel">
  <button class="close" onclick="closePanel()">✕</button>
  <h2 id="pName"></h2>
  <div class="meta" id="pMeta"></div>
  <div class="nb" id="pNb"></div>
  <button id="pOpen">在 Obsidian 中打开</button>
</div>
<div id="help">拖动旋转 · 滚轮缩放 · 悬停看邻居 · 点击看详情<br>布局实时弛豫中，数据 as of 2026-08-22</div>
<script id="graph-data" type="application/json">/*__GRAPH__*/</script>
<script>
"use strict";
const G = JSON.parse(document.getElementById('graph-data').textContent);
const GROUP_STYLE = {
  "root":        {c:"#8ab4ff", label:"根目录索引"},
  "articles/issue1":{c:"#f2b56b", label:"Issue 1"},
  "articles/issue2":{c:"#e8836b", label:"Issue 2"},
  "articles/issue3":{c:"#d95f7a", label:"Issue 3"},
  "articles/issue4":{c:"#b05fc0", label:"Issue 4"},
  "lab-notes":   {c:"#5cc8d7", label:"Lab Notes"},
  "wiki/concepts":{c:"#4ade80", label:"wiki · 概念"},
  "wiki/projects":{c:"#34c98e", label:"wiki · 项目"},
  "wiki/literature":{c:"#a3e635", label:"wiki · 文献"},
  "wiki/daily":  {c:"#86efac", label:"wiki · 日记"},
  "wiki/root":   {c:"#6ee7b7", label:"wiki · 综合"},
  "raw":         {c:"#9aa5c4", label:"raw · 原料"},
  "templates":   {c:"#5b6480", label:"模板"},
};
const gstyle = g => GROUP_STYLE[g] || {c:"#8ab4ff", label:g};
/* ---------- init positions on sphere ---------- */
const N = G.nodes.length;
const idx = {}; G.nodes.forEach((n,i)=>{ idx[n.id]=i;
  const th=Math.acos(1-2*(i+.5)/N), ph=Math.PI*(1+Math.sqrt(5))*i;
  n.x=Math.sin(th)*Math.cos(ph)*140; n.y=Math.sin(th)*Math.sin(ph)*140; n.z=Math.cos(th)*140;
  n.vx=n.vy=n.vz=0;
});
const nbrs = {}; G.nodes.forEach(n=>nbrs[n.id]=new Set());
G.edges.forEach(e=>{ nbrs[e.a].add(e.b); nbrs[e.b].add(e.a); });
/* ---------- force layout ---------- */
function tick(alpha){
  const R=2600;
  for(let i=0;i<N;i++){const a=G.nodes[i];
    for(let j=i+1;j<N;j++){const b=G.nodes[j];
      let dx=a.x-b.x,dy=a.y-b.y,dz=a.z-b.z,d2=dx*dx+dy*dy+dz*dz+40;
      const f=R/d2*alpha; const d=Math.sqrt(d2);
      dx/=d;dy/=d;dz/=d;
      a.vx+=dx*f;a.vy+=dy*f;a.vz+=dz*f; b.vx-=dx*f;b.vy-=dy*f;b.vz-=dz*f;
    }
    a.vx-=a.x*0.01*alpha; a.vy-=a.y*0.01*alpha; a.vz-=a.z*0.01*alpha;
  }
  for(const e of G.edges){const a=G.nodes[idx[e.a]],b=G.nodes[idx[e.b]];
    let dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z;const d=Math.sqrt(dx*dx+dy*dy+dz*dz)+1;
    const f=(d-70)*0.02*alpha; dx/=d;dy/=d;dz/=d;
    a.vx+=dx*f;a.vy+=dy*f;a.vz+=dz*f; b.vx-=dx*f;b.vy-=dy*f;b.vz-=dz*f;
  }
  for(const n of G.nodes){n.x+=n.vx*0.5;n.y+=n.vy*0.5;n.z+=n.vz*0.5;n.vx*=0.82;n.vy*=0.82;n.vz*=0.82;}
  let cx=0,cy=0,cz=0;
  for(const n of G.nodes){cx+=n.x;cy+=n.y;cz+=n.z;}
  cx/=N;cy/=N;cz/=N;
  for(const n of G.nodes){n.x-=cx;n.y-=cy;n.z-=cz;}
}
for(let i=0;i<300;i++) tick(1);
/* ---------- view state ---------- */
let rotY=0, rotX=-0.35, dragging=false, px=0, py=0, zoom=0.9, auto=true;
let hover=null, selected=null, query='';
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
function resize(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
resize();addEventListener('resize',resize);
function proj(n){
  const cy=Math.cos(rotY),sy=Math.sin(rotY),cx=Math.cos(rotX),sx=Math.sin(rotX);
  const x1=n.x*cy+n.z*sy, z1=-n.x*sy+n.z*cy, y1=n.y*cx-z1*sx, z2=n.y*sx+z1*cx;
  const f=620*zoom, s=f/(f+z2);
  return {x:innerWidth/2+x1*s, y:innerHeight/2+y1*s, s, z:z2};
}
/* ---------- legend ---------- */
(function(){
  const used=new Set(G.nodes.map(n=>n.group));
  const lg=document.getElementById('legend');
  Object.keys(GROUP_STYLE).filter(g=>used.has(g)).forEach(g=>{
    const d=document.createElement('div');
    d.innerHTML='<i style="background:'+GROUP_STYLE[g].c+'"></i>'+GROUP_STYLE[g].label;
    lg.appendChild(d);
  });
})();
document.getElementById('stats').innerHTML =
  '<b>'+N+'</b> 节点 &nbsp; <b>'+G.edges.length+'</b> 边 &nbsp; 密度 <b>'+(2*G.edges.length/(N*(N-1))).toFixed(4)+'</b><br>枢纽：主题索引 · index · 🏠 Home · SEU';
/* ---------- render ---------- */
function draw(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  const P = G.nodes.map(proj);
  // edges
  for(const e of G.edges){
    const i=idx[e.a],j=idx[e.b],a=P[i],b=P[j];
    const hl = hover!==null && (i===hover||j===hover) || selected!==null && (i===selected||j===selected);
    const dimmed = (hover!==null||selected!==null) && !hl;
    ctx.strokeStyle = hl ? 'rgba(120,180,255,.95)' : dimmed ? 'rgba(120,130,160,.06)' : 'rgba(160,180,225,.42)';
    ctx.lineWidth = hl?1.6:0.9;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  // nodes
  for(let i=0;i<N;i++){
    const n=G.nodes[i],p=P[i],st=gstyle(n.group);
    const isHov=i===hover, isSel=i===selected;
    const isNbr=(hover!==null&&nbrs[G.nodes[hover].id].has(n.id))||(selected!==null&&nbrs[G.nodes[selected].id].has(n.id));
    const match=query && n.name.toLowerCase().includes(query);
    const dimmed=(hover!==null||selected!==null)&&!isHov&&!isSel&&!isNbr;
    let r=(2.6+Math.sqrt(n.deg)*2.4)*p.s;
    ctx.globalAlpha=dimmed?0.10:1;
    if(match){ctx.shadowColor='#fff';ctx.shadowBlur=16;}else if(isHov||isSel){ctx.shadowColor=st.c;ctx.shadowBlur=14;}else{ctx.shadowColor=st.c;ctx.shadowBlur=6;}
    ctx.fillStyle=isHov||isSel?'#ffffff':st.c;
    ctx.beginPath();ctx.arc(p.x,p.y,Math.max(r,1.1),0,7);ctx.fill();
    ctx.shadowBlur=0;
    if((n.deg>=5&&p.s>0.45)||isHov||isSel||match){
      ctx.fillStyle=dimmed?'rgba(200,205,225,.25)':'rgba(232,236,246,.92)';
      ctx.font=(isHov||isSel?'700 12px':'11px')+' "Noto Serif SC",serif';
      ctx.fillText(n.name.length>26?n.name.slice(0,26)+'…':n.name,p.x+8,p.y+3);
    }
    ctx.globalAlpha=1;
  }
}
/* ---------- loop ---------- */
(function loop(){
  requestAnimationFrame(loop);
  tick(0.05);
  if(auto) rotY+=0.0016;
  draw();
})();
/* ---------- picking ---------- */
function pick(mx,my){
  let best=-1,bd=18*18;
  for(let i=0;i<N;i++){const p=proj(G.nodes[i]);const d=(p.x-mx)*(p.x-mx)+(p.y-my)*(p.y-my);
    if(d<bd){bd=d;best=i;}}
  return best;
}
const tip=document.getElementById('tip');
cv.addEventListener('mousemove',e=>{
  if(dragging){rotY+=(e.clientX-px)*0.005;rotX+=(e.clientY-py)*0.005;rotX=Math.max(-1.4,Math.min(1.4,rotX));px=e.clientX;py=e.clientY;return;}
  const i=pick(e.clientX,e.clientY); hover=i;
  if(i>=0){tip.style.display='block';tip.style.left=e.clientX+14+'px';tip.style.top=e.clientY+10+'px';
    const n=G.nodes[i];tip.textContent=n.name+' · '+n.deg+' 边';}
  else tip.style.display='none';
});
cv.addEventListener('mousedown',e=>{dragging=true;auto=false;px=e.clientX;py=e.clientY;});
addEventListener('mouseup',e=>{
  if(dragging && Math.abs(e.clientX-px)<4 && Math.abs(e.clientY-py)<4){
    const i=pick(e.clientX,e.clientY);
    if(i>=0){selected=i;showPanel(G.nodes[i]);}
  }
  dragging=false;
});
cv.addEventListener('wheel',e=>{zoom*=e.deltaY>0?0.92:1.09;zoom=Math.max(0.3,Math.min(4,zoom));},{passive:true});
cv.addEventListener('dblclick',()=>{auto=true;});
/* ---------- panel ---------- */
function showPanel(n){
  document.getElementById('pName').textContent=n.name;
  document.getElementById('pMeta').innerHTML=
    '位置：'+n.id+'.md<br>分组：'+gstyle(n.group).label+(n.category?' · '+n.category:'')+'<br>度数：'+n.deg+' 条边';
  const nb=[...nbrs[n.id]].sort();
  document.getElementById('pNb').innerHTML=nb.map(t=>'<a href="#" onclick="jump(\''+t.replace(/'/g,"\\'")+'\');return false">'+G.nodes[idx[t]].name+'</a>').join('')||'<span style="color:var(--dim)">孤立节点（暂无出/入边）</span>';
  const btn=document.getElementById('pOpen');
  btn.onclick=()=>{location.href='obsidian://open?vault=fpgahorizons-journal&file='+encodeURIComponent(n.id);};
  document.getElementById('panel').style.display='block';
}
function jump(id){const i=idx[id];if(i===undefined)return;selected=i;showPanel(G.nodes[i]);}
function closePanel(){document.getElementById('panel').style.display='none';selected=null;}
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();});
</script>
</body>
</html>
