[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seu-platform"
version = "1.2.0"
description = "Space-radiation effects simulator for SRAM FPGAs: orbit environment -> per-bit upset rates -> ion strike on a real Vivado layout -> functional consequences"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "juwade" }]
keywords = ["single-event-upset", "FPGA", "radiation-effects", "reliability", "SPENVIS"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []

[project.optional-dependencies]
desktop = ["pywebview>=5"]

[project.urls]
Homepage = "https://github.com/juwadeLone/seu_platform"
Issues = "https://github.com/juwadeLone/seu_platform/issues"

[project.scripts]
seu-platform = "layout_ecc.serve:main"

[tool.setuptools]
package-dir = { "layout_ecc" = "code/layout_ecc_sim/layout_ecc", "orbit_seu" = "code/orbit_seu/orbit_seu" }
packages = ["layout_ecc", "orbit_seu"]

[tool.setuptools.package-data]
layout_ecc = [
    "webapp/*",
    "data/*.json",
    "data/**/*.json",
    "data/**/*.csv",
    "data/**/*.txt",
    "data/**/*.md",
]
orbit_seu = [
    "webapp/*",
    "env_data/**/*",
    "examples/*.json",
]
